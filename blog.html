            <script>
                const hashList = [
                    "ff33b680f008f13d1efa898cd606a65bb0dcbe9d4d2ff6cfa59b5d85dc6eeb35",
                    "b54c3cd26a5fb44f79b2df37bd5f53bc54e0ce35d1b41332125b497a97937e40",
                    "b0981fa41b7abd6f7823e15e12cb37995821c63e5ea9121edebbbe109ec20245",
                    "f702619f6b69760321b7e0745865369161337d39ab6ed948c55c0d10f82a8766",
                    "cff604d5a0f5d8daf789e012aab901b30408357b2e45e43f09a4c8f38b10791d",
                    "2c7198cb7ec159bc79fc63de757a0fb2c69a9e43862368746bb458bd0f822a92"
                ];
                let unlock = 0;

                async function sha256(text) {
                    const enc = new TextEncoder();
                    const buf = await crypto.subtle.digest("SHA-256", enc.encode(text));
                    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
                }

                async function check(level){
                    const inp = document.getElementById("p"+level);
                    const tip = document.getElementById("t"+level);
                    const userHash = await sha256(inp.value.trim());
                    if(userHash === hashList[level-1]){
                        tip.textContent = "";
                        unlock = level;
                        if(level<6){
                            document.getElementById("p"+(level+1)).disabled = false;
                            document.querySelector(`button[onclick="check(${level+1})"]`).disabled = false;
                        }else{
                            document.getElementById("final-msg").style.display="block";
                        }
                    }else{
                        tip.textContent = "";
                    }
                }
            </script>
